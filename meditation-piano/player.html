<title>고요의 건반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#E4E8E2; --ink:#1F2A27; --muted:#5E6B66; --line:#D0D6CE;
  --accent:#4F7361; --accent-soft:rgba(79,115,97,.14); --dusk:#8C86A8;
  --serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#131917; --surface:#1B2320; --ink:#E3E8E3; --muted:#98A59F; --line:#2A3430;
  --accent:#96B8A5; --accent-soft:rgba(150,184,165,.14); --dusk:#A9A3C6;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#131917; --surface:#1B2320; --ink:#E3E8E3; --muted:#98A59F; --line:#2A3430;
  --accent:#96B8A5; --accent-soft:rgba(150,184,165,.14); --dusk:#A9A3C6;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:40px 140px}
header{display:grid;gap:10px;margin-bottom:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:52ch;margin:0}
.breath{display:grid;place-items:center;height:200px;margin:8px 0 20px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 38%,var(--accent-soft),transparent 70%);border:1px solid var(--accent);transform:scale(.72);opacity:.55;transition:opacity .6s}
.orb.on{animation:breathe var(--cycle,8s) ease-in-out infinite;opacity:1}
@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.orb.on{animation:none;transform:scale(1)}}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:-8px;margin-bottom:24px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:2.2em 1fr auto;gap:4px 14px;align-items:baseline;padding:16px 10px;border-radius:6px}
.row:hover{background:var(--surface)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.no{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.t{font-family:var(--serif);font-size:19px}
.en{color:var(--muted);font-size:13px;margin-left:8px}
.dur{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{grid-column:2/4;font-family:var(--mono);font-size:12px;color:var(--muted)}
li.playing .t,li.playing .no{color:var(--accent)}
li.playing .row{background:var(--surface)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.btn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--bg);width:46px;height:46px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctrls{display:flex;gap:8px;align-items:center}
.now{min-width:0;display:grid;gap:4px}
.now-t{font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
@media (max-width:480px){.bar-in{grid-template-columns:1fr;gap:8px}.ctrls{justify-content:center}.time{text-align:center}.en{display:block;margin-left:0}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Solo Piano · 10 Tracks · 30분</div>
    <h1>고요의 건반</h1>
    <p class="lede">느린 템포와 열린 화음, 긴 잔향으로 호흡을 가라앉히는 명상 피아노 10곡입니다. 원을 따라 숨을 들이쉬고 내쉬어 보세요. 원은 곡의 템포에 맞춰 두 마디마다 한 번 숨을 쉽니다.</p>
  </header>

  <div class="breath" aria-hidden="true"><div class="orb" id="orb"></div></div>
  <div class="hint" id="hint">곡을 고르면 호흡 안내가 시작됩니다</div>

  <ol id="list"></ol>
  <p class="foot">한 곡이 끝나면 다음 곡으로 이어집니다. MIDI 파일과 생성 스크립트는 저장소의 <code>meditation-piano/</code> 폴더에 있습니다.</p>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="ctrls">
      <button class="btn" id="prev" aria-label="이전 곡"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2 5 7l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="btn main" id="play" aria-label="재생"><svg id="ic" width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <button class="btn" id="next" aria-label="다음 곡"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
    <div class="now">
      <div class="now-t" id="nowT">1. 새벽의 호흡</div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
    </div>
    <div class="time" id="time">0:00 / 3:00</div>
  </div>
</div>

<audio id="au" preload="metadata"></audio>

<script>
const T=[
 ["새벽의 호흡","Breath of Dawn","C major",59,4,"3:00"],
 ["고요한 호수","Still Lake","D lydian",53,4,"3:00"],
 ["달빛 정원","Moonlit Garden","A minor",59,4,"3:00"],
 ["숲의 숨결","Forest Whisper","G pentatonic",64,4,"3:00"],
 ["흐르는 구름","Drifting Clouds","E♭ major",56,4,"3:00"],
 ["내면의 빛","Inner Light","E major",61,4,"3:00"],
 ["빗소리 명상","Rain Meditation","F♯ dorian",67,4,"3:00"],
 ["별이 머무는 밤","Where Stars Rest","D♭ major",50,4,"3:00"],
 ["치유의 파동","Healing Waves","F major",68,3,"3:00"],
 ["평온한 귀환","Peaceful Return","C major",56,4,"3:00"]];
const $=id=>document.getElementById(id), au=$("au"), list=$("list"), orb=$("orb");
let cur=0;
const src=i=>`audio/${String(i+1).padStart(2,"0")}_${T[i][1].replace(/ /g,"_")}.mp3`;
const fmt=s=>isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`:"0:00";
T.forEach((t,i)=>{
  const li=document.createElement("li");
  li.innerHTML=`<button class="row" id="tr${i}"><span class="no">${String(i+1).padStart(2,"0")}</span><span><span class="t">${t[0]}</span><span class="en">${t[1]}</span></span><span class="dur">${t[5]}</span><span class="meta">${t[2]} · ♩=${t[3]} · ${t[4]}/4</span></button>`;
  li.querySelector("button").onclick=()=>{ if(i===cur&&au.src){toggle()} else load(i,true) };
  list.appendChild(li);
});
function load(i,play){
  cur=(i+T.length)%T.length; au.src=src(cur);
  const t=T[cur]; $("nowT").textContent=`${cur+1}. ${t[0]}`; $("time").textContent=`0:00 / ${t[5]}`;
  orb.style.setProperty("--cycle",(60/t[3]*t[4]*2)+"s");
  $("hint").textContent=`${t[0]} · 두 마디(${(60/t[3]*t[4]*2).toFixed(1)}초)에 한 호흡`;
  [...list.children].forEach((li,j)=>li.classList.toggle("playing",j===cur));
  if(play) au.play().catch(()=>{});
}
function toggle(){ if(!au.src) load(cur,true); else au.paused?au.play():au.pause() }
$("play").onclick=toggle; $("prev").onclick=()=>load(cur-1,true); $("next").onclick=()=>load(cur+1,true);
const ic=$("ic");
au.onplay=()=>{ic.innerHTML='<path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/>';$("play").setAttribute("aria-label","일시정지");orb.classList.add("on")};
au.onpause=()=>{ic.innerHTML='<path d="M4 2l10 6-10 6z" fill="currentColor"/>';$("play").setAttribute("aria-label","재생");orb.classList.remove("on")};
au.ontimeupdate=()=>{ if(au.duration){$("seek").value=au.currentTime/au.duration*1000; $("time").textContent=`${fmt(au.currentTime)} / ${fmt(au.duration)}`}};
$("seek").oninput=e=>{ if(au.duration) au.currentTime=e.target.value/1000*au.duration };
au.onended=()=>load(cur+1,true);
list.children[0].classList.add("playing");
</script>
